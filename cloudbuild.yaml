steps:
  # 1. Install dependencies
  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Build Next.js (includes typecheck)
  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3. Construir imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph-repo/frontend-image:latest',
      '.'
    ]

  # 4. Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph-repo/frontend-image:latest'
    ]

  # 5. Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conectando-ph-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph-repo/frontend-image:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'AUTH_SECRET=AUTH_SECRET:latest'
      - '--set-secrets'
      - 'NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest'
      - '--set-secrets'
      - 'AUTH_CLIENT_SECRET=AUTH_CLIENT_SECRET:latest'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_APP_NAME=Conectando PH'
      - '--set-env-vars'
      - 'NEXTAUTH_SESSION_TIMEOUT=3600'
      - '--set-env-vars'
      - 'AUTH_PROVIDER_DEFAULT=accessEmail'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph-repo/frontend-image:latest'

options:
  logging: CLOUD_LOGGING_ONLY