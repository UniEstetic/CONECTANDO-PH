steps:
  # 1. Construir imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest'
      - '.'

  # 2. Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
