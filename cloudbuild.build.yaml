steps:
  # 1. Install dependencies (pnpm)
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm i -g pnpm
        pnpm install --no-frozen-lockfile

  # 2. Build Next.js (includes typecheck)
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm i -g pnpm
        pnpm build

  # 3. Construir imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest',
      '.'
    ]

  # 4. Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest'
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/conectando-ph/frontend:latest'
